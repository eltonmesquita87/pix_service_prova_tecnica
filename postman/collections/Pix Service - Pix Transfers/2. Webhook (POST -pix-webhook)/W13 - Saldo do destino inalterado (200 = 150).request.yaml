$kind: http-request
url: "{{baseUrl}}/wallets/{{destinoWalletId}}/balance"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.test('Destino = 150', function () { pm.expect(json.balance).to.eql(150); });
    language: text/javascript
order: 13000
