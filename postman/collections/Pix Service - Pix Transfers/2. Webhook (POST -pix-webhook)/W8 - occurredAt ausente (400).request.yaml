$kind: http-request
description: occurredAt é @NotNull, mas o caso de uso não o utiliza.
url: "{{baseUrl}}/pix/webhook"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "endToEndId": "{{endToEndId}}",
      "eventId": "evt-sem-data-{{$guid}}",
      "eventType": "CONFIRMED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
      var json = pm.response.json();
      pm.test('Envelope ErrorResponse', function () {
        pm.expect(json).to.include.keys(['timestamp', 'status', 'error', 'message', 'path']);
        pm.expect(json.status).to.eql(400);
        pm.expect(json.error).to.eql("Validation Failed");
        pm.expect(json.message).to.eql("Occurred at is required");
      });
    language: text/javascript
order: 8000
