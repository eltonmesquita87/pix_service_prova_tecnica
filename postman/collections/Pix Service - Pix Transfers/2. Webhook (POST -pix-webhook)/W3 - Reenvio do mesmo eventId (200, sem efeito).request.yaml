$kind: http-request
description: "Idempotência por eventId: a segunda entrega retorna 200 sem alterar o saldo."
url: "{{baseUrl}}/pix/webhook"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "endToEndId": "{{endToEndId}}",
      "eventId": "{{eventIdA}}",
      "eventType": "CONFIRMED",
      "occurredAt": "2026-11-09T10:30:00"
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 3000
