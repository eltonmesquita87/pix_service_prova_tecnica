$kind: http-request
description: "Origem: 500 - 150 (T1) - 100 (T11) + 100 (estorno de T11) = 350. W10 não alterou nada."
url: "{{baseUrl}}/wallets/{{origemWalletId}}/balance"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.test('Origem = 350', function () { pm.expect(json.balance).to.eql(350); });
    language: text/javascript
order: 12000
