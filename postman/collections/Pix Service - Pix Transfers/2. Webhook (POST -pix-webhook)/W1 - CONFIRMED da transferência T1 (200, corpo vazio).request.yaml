$kind: http-request
description: Credita o destino e grava TRANSFER_CREDIT. Define eventIdA para o reenvio W3.
url: "{{baseUrl}}/pix/webhook"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "endToEndId": "{{endToEndId}}",
      "eventId": "{{eventIdA}}",
      "eventType": "CONFIRMED",
      "occurredAt": "2026-11-09T10:30:00"
    }
scripts:
  - type: beforeRequest
    code: pm.environment.set('eventIdA', 'evt-' + Date.now() + '-A');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('Corpo vazio', function () { pm.expect(pm.response.text()).to.eql(''); });
    language: text/javascript
order: 1000
