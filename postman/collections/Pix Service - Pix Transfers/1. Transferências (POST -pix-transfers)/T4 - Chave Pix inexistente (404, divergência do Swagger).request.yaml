$kind: http-request
description: "Divergência: o Swagger documenta 400. O código responde 404 (WalletNaoEncontradaException)."
url: "{{baseUrl}}/pix/transfers"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{idemKey}}"
body:
  type: json
  content: |-
    {
      "fromWalletId": {{origemWalletId}},
      "pixKey": "nao-existe@example.com",
      "amount": 10.00
    }
scripts:
  - type: beforeRequest
    code: pm.environment.set('idemKey', 'idem-' + Date.now() + '-' + Math.floor(Math.random() * 1000000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 404', function () { pm.response.to.have.status(404); });
      var json = pm.response.json();
      pm.test('Envelope ErrorResponse', function () {
        pm.expect(json).to.include.keys(['timestamp', 'status', 'error', 'message', 'path']);
        pm.expect(json.status).to.eql(404);
        pm.expect(json.error).to.eql("Not Found");
        pm.expect(json.message).to.eql("Pix key not found: nao-existe@example.com");
      });
    language: text/javascript
order: 4000
