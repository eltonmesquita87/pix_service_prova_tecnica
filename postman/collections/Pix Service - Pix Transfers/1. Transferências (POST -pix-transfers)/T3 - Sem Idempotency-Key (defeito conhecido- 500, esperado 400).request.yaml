$kind: http-request
name: "T3 - Sem Idempotency-Key (defeito conhecido: 500, esperado 400)"
description: Defeito conhecido. Header ausente gera MissingRequestHeaderException, sem handler próprio, então cai no genérico (500). Swagger e o teste desabilitado esperam 400.
url: "{{baseUrl}}/pix/transfers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fromWalletId": {{origemWalletId}},
      "pixKey": "{{chavePixDestino}}",
      "amount": 150.00
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 500', function () { pm.response.to.have.status(500); });
      var json = pm.response.json();
      pm.test('Envelope ErrorResponse', function () {
        pm.expect(json).to.include.keys(['timestamp', 'status', 'error', 'message', 'path']);
        pm.expect(json.status).to.eql(500);
        pm.expect(json.error).to.eql("Internal Server Error");
        pm.expect(json.message).to.eql("An unexpected error occurred");
      });
    language: text/javascript
order: 3000
