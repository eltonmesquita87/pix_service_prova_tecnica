$kind: http-request
description: "Divergência: o Swagger documenta 400. O código responde 409 (SaldoInsuficienteException)."
url: "{{baseUrl}}/pix/transfers"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{idemKey}}"
body:
  type: json
  content: |-
    {
      "fromWalletId": {{origemWalletId}},
      "pixKey": "{{chavePixDestino}}",
      "amount": 999999.00
    }
scripts:
  - type: beforeRequest
    code: pm.environment.set('idemKey', 'idem-' + Date.now() + '-' + Math.floor(Math.random() * 1000000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', function () { pm.response.to.have.status(409); });
      var json = pm.response.json();
      pm.test('Envelope ErrorResponse', function () {
        pm.expect(json).to.include.keys(['timestamp', 'status', 'error', 'message', 'path']);
        pm.expect(json.status).to.eql(409);
        pm.expect(json.error).to.eql("Conflict");
        pm.expect(json.message).to.eql("Insufficient balance");
      });
    language: text/javascript
order: 7000
