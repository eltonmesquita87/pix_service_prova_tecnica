$kind: http-request
description: Debita a origem na hora e cria a transferência PENDING. O destino só é creditado no webhook CONFIRMED (W1). Define endToEndId.
url: "{{baseUrl}}/pix/transfers"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{idemKey}}"
body:
  type: json
  content: |-
    {
      "fromWalletId": {{origemWalletId}},
      "pixKey": "{{chavePixDestino}}",
      "amount": 150.00
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', function () { pm.response.to.have.status(201); });
      var json = pm.response.json();
      pm.test('TransferPixResponse PENDING', function () {
        pm.expect(json.endToEndId).to.match(/^E[0-9a-f]{32}$/);
        pm.expect(json.fromWalletId).to.eql(Number(pm.environment.get('origemWalletId')));
        pm.expect(json.toWalletId).to.eql(Number(pm.environment.get('destinoWalletId')));
        pm.expect(json.amount).to.eql(150);
        pm.expect(json.status).to.eql('PENDING');
      });
      pm.environment.set('endToEndId', json.endToEndId);
      pm.environment.set('idemKeyA', pm.environment.get('idemKey'));
    language: text/javascript
order: 1000
