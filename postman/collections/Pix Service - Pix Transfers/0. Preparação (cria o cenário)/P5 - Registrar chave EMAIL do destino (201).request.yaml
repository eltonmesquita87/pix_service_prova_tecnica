$kind: http-request
description: Chave que o pagador informa em TransferPixRequest.pixKey.
url: "{{baseUrl}}/wallets/{{destinoWalletId}}/pix-keys"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "keyType": "EMAIL",
      "keyValue": "{{chavePixDestino}}"
    }
scripts:
  - type: beforeRequest
    code: pm.environment.set('chavePixDestino', 'destino.' + Date.now() + '@example.com');
    language: text/javascript
  - type: afterResponse
    code: pm.test('HTTP 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 5000
