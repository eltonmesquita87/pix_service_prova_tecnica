$kind: http-request
url: "{{baseUrl}}/wallets/{{origemWalletId}}/deposit"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": 500.00
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.test('Saldo da origem = 500', function () { pm.expect(json.balance).to.eql(500); });
    language: text/javascript
order: 3000
