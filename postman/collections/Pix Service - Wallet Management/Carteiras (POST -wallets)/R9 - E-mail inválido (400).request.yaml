$kind: http-request
description: "E-mail: regex do domínio, até 254 caracteres."
url: "{{baseUrl}}/wallets"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": "email-invalido-{{$randomUUID}}",
      "email": "maria@"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
      var json = pm.response.json();
      pm.test('Envelope ErrorResponse', function () {
        pm.expect(json).to.include.keys(['timestamp', 'status', 'error', 'message', 'path']);
        pm.expect(json.status).to.eql(400);
        pm.expect(json.error).to.eql("Bad Request");
        pm.expect(json.message).to.eql("Invalid email");
      });
    language: text/javascript
order: 10000
