$kind: http-request
description: StrictStringDeserializer recusa token que não seja string JSON.
  Vira HttpMessageNotReadableException, mapeada para 400 "Malformed request
  body".
url: "{{baseUrl}}/wallets"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": "cpf-numero-{{$randomUUID}}",
      "cpf": 12345678909
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
      var json = pm.response.json();
      pm.test('Envelope ErrorResponse', function () {
        pm.expect(json).to.include.keys(['timestamp', 'status', 'error', 'message', 'path']);
        pm.expect(json.status).to.eql(400);
        pm.expect(json.error).to.eql("Bad Request");
        pm.expect(json.message).to.eql("Malformed request body");
      });
    language: text/javascript
order: 11000
