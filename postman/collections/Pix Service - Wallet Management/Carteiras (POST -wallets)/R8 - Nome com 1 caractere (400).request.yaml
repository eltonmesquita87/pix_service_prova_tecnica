$kind: http-request
description: "Nome: de 2 a 150 caracteres após trim."
url: "{{baseUrl}}/wallets"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": "nome-curto-{{$randomUUID}}",
      "nome": "A"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
      var json = pm.response.json();
      pm.test('Envelope ErrorResponse', function () {
        pm.expect(json).to.include.keys(['timestamp', 'status', 'error', 'message', 'path']);
        pm.expect(json.status).to.eql(400);
        pm.expect(json.error).to.eql("Bad Request");
        pm.expect(json.message).to.eql("Invalid name");
      });
    language: text/javascript
order: 9000
