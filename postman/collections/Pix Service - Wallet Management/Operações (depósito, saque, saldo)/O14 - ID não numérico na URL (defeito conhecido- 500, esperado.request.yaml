$kind: http-request
name: "O14 - ID não numérico na URL (defeito conhecido: 500, esperado 400)"
description: Defeito conhecido. Falha de conversão do @PathVariable Long cai no handler genérico (500). O esperado seria 400.
url: "{{baseUrl}}/wallets/abc/balance"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 500', function () { pm.response.to.have.status(500); });
      var json = pm.response.json();
      pm.test('Envelope ErrorResponse', function () {
        pm.expect(json).to.include.keys(['timestamp', 'status', 'error', 'message', 'path']);
        pm.expect(json.status).to.eql(500);
        pm.expect(json.error).to.eql("Internal Server Error");
        pm.expect(json.message).to.eql("An unexpected error occurred");
      });
    language: text/javascript
order: 14000
