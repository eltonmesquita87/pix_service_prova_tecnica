$kind: http-request
description: 'Divergência: o Swagger documenta 400 ("Valor inválido ou saldo insuficiente"). O código responde 409 (SaldoInsuficienteException).'
url: "{{baseUrl}}/wallets/{{walletId}}/withdraw"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": 1000.00
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', function () { pm.response.to.have.status(409); });
      var json = pm.response.json();
      pm.test('Envelope ErrorResponse', function () {
        pm.expect(json).to.include.keys(['timestamp', 'status', 'error', 'message', 'path']);
        pm.expect(json.status).to.eql(409);
        pm.expect(json.error).to.eql("Conflict");
        pm.expect(json.message.indexOf("Insufficient balance")).to.eql(0);
      });
    language: text/javascript
order: 7000
