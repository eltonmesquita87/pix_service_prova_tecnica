$kind: http-request
description: Sem "at", lê wallets.balance. Espera 60 (depósito 100 menos saque 40).
url: "{{baseUrl}}/wallets/{{walletId}}/balance"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.test('BalanceResponse atual', function () {
        pm.expect(json.walletId).to.eql(Number(pm.environment.get('walletId')));
        pm.expect(json.balance).to.eql(60);
        pm.expect(json.timestamp).to.be.a('string');
      });
    language: text/javascript
order: 9000
