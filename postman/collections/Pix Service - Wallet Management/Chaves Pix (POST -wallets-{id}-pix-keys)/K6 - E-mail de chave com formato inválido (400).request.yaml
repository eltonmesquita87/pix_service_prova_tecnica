$kind: http-request
description: Valor "abc" não passa na regex de EMAIL.
url: "{{baseUrl}}/wallets/{{walletId}}/pix-keys"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "keyType": "EMAIL",
      "keyValue": "abc"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
      var json = pm.response.json();
      pm.test('Envelope ErrorResponse', function () {
        pm.expect(json).to.include.keys(['timestamp', 'status', 'error', 'message', 'path']);
        pm.expect(json.status).to.eql(400);
        pm.expect(json.error).to.eql("Bad Request");
        pm.expect(json.message).to.eql("Invalid email format: abc");
      });
    language: text/javascript
order: 6000
