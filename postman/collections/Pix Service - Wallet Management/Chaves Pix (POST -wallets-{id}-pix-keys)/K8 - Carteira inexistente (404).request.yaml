$kind: http-request
description: A existência da carteira é checada antes da duplicidade e do formato.
url: "{{baseUrl}}/wallets/999999999/pix-keys"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "keyType": "EMAIL",
      "keyValue": "nao.existe@example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 404', function () { pm.response.to.have.status(404); });
      var json = pm.response.json();
      pm.test('Envelope ErrorResponse', function () {
        pm.expect(json).to.include.keys(['timestamp', 'status', 'error', 'message', 'path']);
        pm.expect(json.status).to.eql(404);
        pm.expect(json.error).to.eql("Not Found");
        pm.expect(json.message).to.eql("Wallet not found: 999999999");
      });
    language: text/javascript
order: 8000
