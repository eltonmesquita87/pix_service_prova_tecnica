$kind: http-request
description: Repete a chave de K1. A checagem de duplicidade acontece antes da validação de formato.
url: "{{baseUrl}}/wallets/{{walletId}}/pix-keys"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "keyType": "EMAIL",
      "keyValue": "{{chavePixEmail}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', function () { pm.response.to.have.status(409); });
      var json = pm.response.json();
      pm.test('Envelope ErrorResponse', function () {
        pm.expect(json).to.include.keys(['timestamp', 'status', 'error', 'message', 'path']);
        pm.expect(json.status).to.eql(409);
        pm.expect(json.error).to.eql("Conflict");
        pm.expect(json.message.indexOf("Pix key already registered: ")).to.eql(0);
      });
    language: text/javascript
order: 5000
